<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="codemirror.min.css">
    <link rel="stylesheet" href="material-darker.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            min-height: 100%;
            width: 100%;
            background: #0d0d14;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .CodeMirror {
            position: absolute !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100% !important;
            width: 100% !important;
            font-family: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.65;
            background: #0d0d14 !important;
            color: #eff !important;
        }

        /* Gutter (line numbers) */
        .CodeMirror-gutters {
            background: #0d0d14 !important;
            border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
        }
        .CodeMirror-linenumber {
            color: rgba(255, 255, 255, 0.3) !important;
            padding: 0 10px 0 6px !important;
            font-size: 12px;
        }

        /* Active line */
        .CodeMirror-activeline-background {
            background: rgba(108, 99, 255, 0.08) !important;
        }

        /* Cursor */
        .CodeMirror-cursor {
            border-left: 2px solid #6C63FF !important;
        }

        /* Selection */
        .CodeMirror-selected {
            background: rgba(108, 99, 255, 0.25) !important;
        }
        .CodeMirror-focused .CodeMirror-selected {
            background: rgba(108, 99, 255, 0.35) !important;
        }

        /* Matching brackets */
        .CodeMirror-matchingbracket {
            color: #00E676 !important;
            text-decoration: underline;
            font-weight: bold;
        }
        .CodeMirror-nonmatchingbracket {
            color: #FF5252 !important;
        }

        /* Scrollbars */
        .CodeMirror-vscrollbar::-webkit-scrollbar,
        .CodeMirror-hscrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .CodeMirror-vscrollbar::-webkit-scrollbar-track,
        .CodeMirror-hscrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .CodeMirror-vscrollbar::-webkit-scrollbar-thumb,
        .CodeMirror-hscrollbar::-webkit-scrollbar-thumb {
            background: rgba(108, 99, 255, 0.3);
            border-radius: 3px;
        }

        /* Custom token overrides for deeper syntax color palette */
        .cm-s-material-darker .cm-keyword   { color: #C792EA !important; }
        .cm-s-material-darker .cm-string    { color: #C3E88D !important; }
        .cm-s-material-darker .cm-number    { color: #F78C6C !important; }
        .cm-s-material-darker .cm-comment   { color: #546E7A !important; font-style: italic; }
        .cm-s-material-darker .cm-def       { color: #82AAFF !important; }
        .cm-s-material-darker .cm-variable  { color: #EEFFFF !important; }
        .cm-s-material-darker .cm-variable-2 { color: #F07178 !important; }
        .cm-s-material-darker .cm-property  { color: #FFCB6B !important; }
        .cm-s-material-darker .cm-operator  { color: #89DDFF !important; }
        .cm-s-material-darker .cm-atom      { color: #F78C6C !important; }

        /* Autocomplete dropdown popup */
        #autocomplete-popup {
            display: none;
            position: absolute;
            z-index: 2000;
            background: #181824;
            border: 1px solid rgba(108, 99, 255, 0.4);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            max-height: 180px;
            overflow-y: auto;
            min-width: 200px;
            font-family: 'JetBrains Mono', monospace;
        }
        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .autocomplete-item:hover {
            background: rgba(108, 99, 255, 0.25);
        }
        .autocomplete-label {
            color: #EEFFFF;
            font-weight: 500;
        }
        .autocomplete-detail {
            color: #8E8E93;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <textarea id="code"></textarea>
    <div id="autocomplete-popup"></div>

    <script src="codemirror.min.js"></script>
    <script src="javascript.min.js"></script>
    <script src="closebrackets.min.js"></script>
    <script src="matchbrackets.min.js"></script>
    <script src="active-line.min.js"></script>
    <script src="comment.min.js"></script>
    <script>
        console.log("Scriptam: script tag executing. CodeMirror type: " + (typeof CodeMirror));
        var editor = null;
        var pendingCode = null;

        function b64ToUtf8(str) {
            try {
                var binStr = atob(str);
                var bytes = new Uint8Array(binStr.length);
                for (var i = 0; i < binStr.length; i++) {
                    bytes[i] = binStr.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch (e) {
                try {
                    return decodeURIComponent(escape(atob(str)));
                } catch (e2) {
                    return atob(str);
                }
            }
        }

        function initEditor() {
            if (editor) return;
            console.log("Scriptam: initEditor starting");
            var textarea = document.getElementById('code');
            if (!textarea) {
                console.error("Scriptam: textarea #code not found!");
                return;
            }

            try {
                editor = CodeMirror.fromTextArea(textarea, {
                    mode:              'javascript',
                    theme:             'material-darker',
                    lineNumbers:       true,
                    autoCloseBrackets: true,
                    matchBrackets:     true,
                    styleActiveLine:   true,
                    indentUnit:        2,
                    tabSize:           2,
                    indentWithTabs:    false,
                    lineWrapping:      true,
                    inputStyle:        'textarea',
                    extraKeys: {
                        'Ctrl-/':  'toggleComment',
                        'Cmd-/':   'toggleComment',
                        'Tab':     function(cm) {
                            if (cm.somethingSelected()) {
                                cm.indentSelection('add');
                            } else {
                                cm.replaceSelection('  ', 'end');
                            }
                        }
                    }
                });
            } catch (err) {
                console.error("Scriptam: CodeMirror initialization failed: " + err);
                return;
            }

            /* --- Bridge: JS -> Android --- */
            var _changeTimer = null;
            editor.on('change', function() {
                clearTimeout(_changeTimer);
                _changeTimer = setTimeout(function() {
                    try {
                        if (window.ScriptamBridge && window.ScriptamBridge.onCodeChange) {
                            ScriptamBridge.onCodeChange(editor.getValue());
                        }
                    } catch (e) { }
                }, 200);
            });

            window.addEventListener('resize', function() {
                if (editor) {
                    editor.refresh();
                }
            });

            // If code was already delivered before init finished
            if (pendingCode !== null) {
                setCodeBase64(pendingCode);
                pendingCode = null;
            } else {
                // Pull directly from Android bridge if available
                try {
                    if (window.ScriptamBridge && window.ScriptamBridge.getInitialCode) {
                        var initialB64 = window.ScriptamBridge.getInitialCode();
                        if (initialB64) {
                            setCodeBase64(initialB64);
                        }
                    }
                } catch (e) {
                    console.error("Scriptam: Error getting initial code from bridge: " + e);
                }
            }

            // Signal readiness to Android
            try {
                if (window.ScriptamBridge && window.ScriptamBridge.onEditorReady) {
                    ScriptamBridge.onEditorReady();
                }
            } catch (e) {}

            setTimeout(function() {
                if (editor) editor.refresh();
            }, 50);
        }

        /** Set editor content from a Base64-encoded string (avoids escaping issues). */
        function setCodeBase64(b64) {
            if (!editor) {
                pendingCode = b64;
                return;
            }
            try {
                var decoded = b64ToUtf8(b64);
                if (editor.getValue() === decoded) {
                    return; // Avoid resetting cursor if code hasn't changed
                }
                editor.setValue(decoded);
            } catch (e) {
                console.error("Scriptam: Error decoding code: " + e);
                try {
                    var plainDecoded = atob(b64);
                    if (editor.getValue() === plainDecoded) {
                        return;
                    }
                    editor.setValue(plainDecoded);
                } catch (e2) {}
            }
            editor.clearHistory();
            editor.setCursor(0, 0);
            setTimeout(function() {
                if (editor) editor.refresh();
            }, 50);
        }

        /** Return current editor content. */
        function getCode() {
            return editor ? editor.getValue() : "";
        }

        /** Toggle read-only mode (used during script execution). */
        function setReadOnly(flag) {
            if (!editor) return;
            editor.setOption('readOnly', flag ? 'nocursor' : false);
            document.body.style.opacity = flag ? '0.6' : '1';
        }

        /** Ensure tapping on editor triggers focus and brings up the keyboard */
        function focusEditor() {
            if (editor) {
                if (!editor.hasFocus()) {
                    editor.focus();
                }
                try {
                    if (window.ScriptamBridge && window.ScriptamBridge.showKeyboard) {
                        window.ScriptamBridge.showKeyboard();
                    }
                } catch (e) {}
            }
        }

        document.addEventListener('click', function(e) {
            focusEditor();
        });

        /** Insert character or symbol at cursor. */
        function insertText(text) {
            if (!editor) return;
            editor.focus();
            var doc = editor.getDoc();
            var cursor = doc.getCursor();
            if (text === 'Tab') {
                doc.replaceSelection('  ', 'end');
            } else if (text === '{}') {
                doc.replaceRange('{\n  \n}', cursor);
                doc.setCursor({line: cursor.line + 1, ch: 2});
            } else if (text === '()') {
                doc.replaceRange('()', cursor);
                doc.setCursor({line: cursor.line, ch: cursor.ch + 1});
            } else if (text === '[]') {
                doc.replaceRange('[]', cursor);
                doc.setCursor({line: cursor.line, ch: cursor.ch + 1});
            } else {
                doc.replaceSelection(text, 'end');
            }
        }

        /** Trigger editor undo. */
        function editorUndo() {
            if (editor) {
                editor.focus();
                editor.undo();
            }
        }

        /** Trigger editor redo. */
        function editorRedo() {
            if (editor) {
                editor.focus();
                editor.redo();
            }
        }

        /** Insert code snippet at current selection. */
        function insertSnippetBase64(b64) {
            if (!editor) return;
            try {
                var snippet = b64ToUtf8(b64);
                editor.focus();
                var doc = editor.getDoc();
                doc.replaceSelection(snippet, 'end');
            } catch (e) {
                console.error("Scriptam: Error inserting snippet: " + e);
            }
        }

        /* --- Trie Autocomplete UI Controller --- */
        var acPopup = document.getElementById('autocomplete-popup');
        var acToken = null;

        function hideAutocomplete() {
            if (acPopup) acPopup.style.display = 'none';
            acToken = null;
        }

        function triggerAutocomplete() {
            if (!editor || !acPopup || !window.ScriptamBridge || !window.ScriptamBridge.getCompletions) return;
            var doc = editor.getDoc();
            var cursor = doc.getCursor();
            var line = doc.getLine(cursor.line);
            var before = line.slice(0, cursor.ch);
            var match = before.match(/([a-zA-Z0-9_$.]+)$/);
            if (!match || match[1].length < 2) {
                hideAutocomplete();
                return;
            }
            var word = match[1];
            var startCh = cursor.ch - word.length;
            acToken = { line: cursor.line, from: startCh, to: cursor.ch };

            try {
                var json = window.ScriptamBridge.getCompletions(word);
                var items = JSON.parse(json || "[]");
                if (!items || items.length === 0) {
                    hideAutocomplete();
                    return;
                }
                acPopup.innerHTML = '';
                items.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerHTML = '<span class="autocomplete-label">' + item.label + '</span>' +
                                    '<span class="autocomplete-detail">' + (item.detail || '') + '</span>';
                    div.onmousedown = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var curCursor = doc.getCursor();
                        doc.replaceRange(item.insertText, {line: acToken.line, ch: acToken.from}, {line: curCursor.line, ch: curCursor.ch});
                        hideAutocomplete();
                        editor.focus();
                    };
                    acPopup.appendChild(div);
                });
                var coords = editor.cursorCoords(true, 'page');
                acPopup.style.left = Math.max(10, Math.min(coords.left, window.innerWidth - 220)) + 'px';
                acPopup.style.top = (coords.bottom + 6) + 'px';
                acPopup.style.display = 'block';
            } catch (err) {
                console.error("Scriptam: Autocomplete error: " + err);
                hideAutocomplete();
            }
        }

        document.addEventListener('click', function(e) {
            if (acPopup && !acPopup.contains(e.target)) {
                hideAutocomplete();
            }
        });

        // Initialize immediately
        initEditor();
        if (editor) {
            editor.on('inputRead', function(cm, change) {
                triggerAutocomplete();
            });
            editor.on('cursorActivity', function() {
                // If cursor moves far, dismiss
            });
        }
    </script>
</body>
</html>
